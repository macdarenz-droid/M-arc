# M/ARC coach proxy. Holds the Anthropic key; the app never does.
# Deploy:  npx wrangler@4 login && npx wrangler@4 deploy && npx wrangler@4 secret put ANTHROPIC_API_KEY
name = "marc-coach"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The model every route uses by default. Sonnet 5 was chosen for the judgment each route needs;
# Opus 5 ("claude-opus-5") is the next step up if ever wanted. See proxy/README.md "Change the model".
MODEL = "claude-sonnet-5"
# Optional: override one route's model without touching the others, e.g. MODEL_TAG_EXERCISE = "claude-haiku-4-5-20251001".
# Uncomment and set only the ones you want to change; every route falls back to MODEL above.
# MODEL_EXPLAIN = ""
# MODEL_TAG_EXERCISE = ""
# MODEL_NOTES = ""
# MODEL_ASK = ""
# MODEL_IDENTIFY_EXERCISE = ""
# MODEL_IMPORT_PROGRAMME = ""
# MODEL_BUILD_SPLIT = ""
# Explanations per device per day and per day in total. Soft caps, best effort.
MAX_DAILY_PER_DEVICE = "12"
MAX_DAILY_TOTAL = "2000"
# Comma-separated web origins allowed to call this Worker, for the PWA. The Android app sends no Origin
# (or capacitor://localhost / http(s)://localhost), which is always allowed.
ALLOWED_ORIGINS = "https://mrcdrnzz.netlify.app"

# Per-device burst limit: 6 requests a minute. Free on every plan.
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Optional daily quotas. Create the namespace once and paste its id here:
#   npx wrangler@4 kv namespace create QUOTA
# [[kv_namespaces]]
# binding = "QUOTA"
# id = "paste-the-id-here"

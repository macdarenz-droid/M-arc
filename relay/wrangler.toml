# Relay: shared workspace for you and your agents. Deploy: npx wrangler deploy (pinned in package.json).
# Set the owner key once: npx wrangler secret put OWNER_KEY   (CI does it from the RELAY_OWNER_KEY repo secret)
# Assigned agents need a key per provider you use: OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY (wrangler secret put …)
name = "relay"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[vars]
MAX_FILE_MB = "25"

# public/ is served by the Worker (run_worker_first) so every response gets the same security headers.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# All data lives in one SQLite-backed Durable Object (src/worker.ts).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayStore"

# Model API calls leave from eastern North America (see UsEgress in src/worker.ts).
[[durable_objects.bindings]]
name = "EGRESS"
class_name = "UsEgress"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UsEgress"]

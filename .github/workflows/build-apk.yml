name: M/ARC gate

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marc-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Escobar Worker typecheck and tests
        run: npm --prefix escobar-worker ci && npm --prefix escobar-worker run check
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Validate built web source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          for f in ('package.json', 'capacitor.config.json', 'www/manifest.webmanifest'):
              json.loads(Path(f).read_text(encoding='utf-8'))
          data = Path('www/index.html').read_bytes()
          if not data: raise SystemExit('www/index.html is empty')
          sw = Path('www/sw.js').read_text()
          if '__BUILD__' in sw: raise SystemExit('service worker cache name was not stamped')
          print('Built source SHA256:', hashlib.sha256(data).hexdigest())
          PY
      - name: Install Chromium for the visual gate
        run: npx playwright install --with-deps chromium
      - name: Visual and migration gate (five themes, legacy import)
        run: npm run gate
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARC-gate-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload built web app
        uses: actions/upload-artifact@v4
        with:
          name: MARC-www
          path: www/
          retention-days: 7

  android-gate:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build the web app
        run: npm run build

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>26', s)
          if n == 0: raise SystemExit('minSdkVersion not found')
          p.write_text(s,encoding='utf-8')
          PY
          npx cap sync android
          PKG='android/app/src/main/java/com/mrcdrnzz/dailytracker'
          mkdir -p "$PKG"
          cp native/MainActivity.java native/HealthConnectNativePlugin.java native/PermissionsRationaleActivity.java "$PKG/"
          mkdir -p "$PKG/watch/core" && cp native/watch/*.java "$PKG/watch/" && cp native/watch/core/*.java "$PKG/watch/core/"
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          # Replace Capacitor launcher assets with the M/ARC icon copied into www/ by the build.
          ICON='www/icon-512.png'
          test -f "$ICON" || { echo '::error::www/icon-512.png missing'; exit 1; }
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$d"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher.png"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher_round.png"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#08090A</color></resources>
          XML
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Verify bundled source and native plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source=Path('www/index.html').read_bytes()
          bundled=Path('android/app/src/main/assets/public/index.html').read_bytes()
          if bundled != source: raise SystemExit('Capacitor bundled index differs from built www/index.html')
          print('Android bundled index exact-byte PASS:', hashlib.sha256(bundled).hexdigest())
          PY
          PLUGINS='android/app/src/main/assets/capacitor.plugins.json'
          for plugin in LocalNotifications Filesystem Share Haptics; do grep -qi "$plugin" "$PLUGINS" || { echo "::error::$plugin plugin missing from the APK"; exit 1; }; done
          PKG='android/app/src/main/java/com/mrcdrnzz/dailytracker'
          test -f "$PKG/HealthConnectNativePlugin.java" || { echo '::error::HealthConnectNativePlugin.java not copied into the Android project'; exit 1; }
          test -f "$PKG/watch/WatchBridgePlugin.java" || { echo '::error::WatchBridgePlugin.java not copied into the Android project'; exit 1; }
          test -f "$PKG/watch/core/HeartRateMeasurement.java" || { echo '::error::watch/core sensor classes not copied into the Android project'; exit 1; }
          grep -q 'android.permission.health.READ_HEART_RATE' android/app/src/main/AndroidManifest.xml || { echo '::error::health permissions not patched into the manifest'; exit 1; }
          grep -q 'android.permission.health.READ_RESTING_HEART_RATE' android/app/src/main/AndroidManifest.xml || { echo '::error::resting heart rate permission missing: the plugin reads RestingHeartRateRecord'; exit 1; }
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml || { echo '::error::watch Bluetooth permissions not patched into the manifest'; exit 1; }
          grep -q 'foregroundServiceType="connectedDevice"' android/app/src/main/AndroidManifest.xml || { echo '::error::WatchService foreground service type not patched into the manifest'; exit 1; }

      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: marc-debug-signing-v1

      - name: Install stable M/ARC debug signing key
        shell: bash
        env:
          MARC_DEBUG_KEYSTORE_B64: 
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            printf '%s' "$MARC_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains the built app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          source=Path('www/index.html').read_bytes()
          with zipfile.ZipFile(apk) as z: bundled=z.read('assets/public/index.html')
          if bundled != source: raise SystemExit('APK embedded index differs from built www/index.html')
          print('Debug APK embedded source PASS:', hashlib.sha256(bundled).hexdigest())
          PY
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MARC-debug.apk
          sha256sum release-output/MARC-debug.apk > release-output/MARC-debug.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARC-DEBUG-APK
          path: |
            release-output/MARC-debug.apk
            release-output/MARC-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

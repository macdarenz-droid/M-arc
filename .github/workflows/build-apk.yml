name: M/ARC gate

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marc-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Coach proxy typecheck and tests
        run: npm --prefix proxy ci && npm --prefix proxy run check
      - name: Native heart-rate metrics parity
        shell: bash
        run: |
          set -euo pipefail
          # The Java recorder and the TypeScript summariser must produce the
          # same numbers, or the finish screen and History disagree about the
          # same workout.
          mkdir -p native-test-build
          javac -d native-test-build native/HeartRateMetrics.java native-tests/HeartRateMetricsTest.java
          java -cp native-test-build com.mrcdrnzz.dailytracker.HeartRateMetricsTest
      - name: Validate built web source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          for f in ('package.json', 'capacitor.config.json', 'www/manifest.webmanifest'):
              json.loads(Path(f).read_text(encoding='utf-8'))
          data = Path('www/index.html').read_bytes()
          if not data: raise SystemExit('www/index.html is empty')
          sw = Path('www/sw.js').read_text()
          if '__BUILD__' in sw: raise SystemExit('service worker cache name was not stamped')
          print('Built source SHA256:', hashlib.sha256(data).hexdigest())
          PY
      - name: Install Chromium for the visual gate
        run: npx playwright install --with-deps chromium
      - name: Visual and migration gate (five themes, legacy import)
        run: npm run gate
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARC-gate-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload built web app
        uses: actions/upload-artifact@v4
        with:
          name: MARC-www
          path: www/
          retention-days: 7

  android-gate:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build the web app
        run: npm run build

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>26', s)
          if n == 0: raise SystemExit('minSdkVersion not found')
          p.write_text(s,encoding='utf-8')
          PY
          npx cap sync android
          # cap sync only wires npm plugins. Without this the hand-written
          # native layer never reaches the project and every native call
          # silently resolves to nothing in a perfectly valid APK.
          npm run cap:prepare
          # Replace Capacitor launcher assets with the M/ARC icon copied into www/ by the build.
          ICON='www/icon-512.png'
          test -f "$ICON" || { echo '::error::www/icon-512.png missing'; exit 1; }
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$d"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher.png"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher_round.png"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#08090A</color></resources>
          XML
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Verify bundled source and native plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source=Path('www/index.html').read_bytes()
          bundled=Path('android/app/src/main/assets/public/index.html').read_bytes()
          if bundled != source: raise SystemExit('Capacitor bundled index differs from built www/index.html')
          print('Android bundled index exact-byte PASS:', hashlib.sha256(bundled).hexdigest())
          PY
          PLUGINS='android/app/src/main/assets/capacitor.plugins.json'
          for plugin in LocalNotifications Filesystem Share Haptics; do grep -qi "$plugin" "$PLUGINS" || { echo "::error::$plugin plugin missing from the APK"; exit 1; }; done
          # The hand-written bridge is not listed in capacitor.plugins.json, so
          # check the sources and the manifest entries it needs directly.
          PKG='android/app/src/main/java/com/mrcdrnzz/dailytracker'
          for src in MainActivity HealthConnectNativePlugin HeartRateNativePlugin HeartRateService HeartRateDatabase HeartRateMetrics HeartRateDeviceScanner HeartRateMeasurement PermissionsRationaleActivity; do
            test -f "$PKG/$src.java" || { echo "::error::$src.java missing from the Android project"; exit 1; }
          done
          MANIFEST='android/app/src/main/AndroidManifest.xml'
          for entry in 'android.permission.BLUETOOTH_CONNECT' 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' '.HeartRateService' 'android:allowBackup="false"'; do
            grep -q "$entry" "$MANIFEST" || { echo "::error::$entry missing from AndroidManifest.xml"; exit 1; }
          done

      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: marc-debug-signing-v1

      - name: Install stable M/ARC debug signing key
        shell: bash
        env:
          MARC_DEBUG_KEYSTORE_B64: 
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            printf '%s' "$MARC_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains the built app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          source=Path('www/index.html').read_bytes()
          with zipfile.ZipFile(apk) as z:
              bundled=z.read('assets/public/index.html')
              # The hand-written bridge has to be IN the APK, not merely on disk
              # beside it. Checking the sources and the manifest proves what went
              # into the build; only the compiled dex proves what came out — and
              # an APK that builds cleanly with the whole native layer missing is
              # exactly the failure this repo already shipped once.
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          if bundled != source: raise SystemExit('APK embedded index differs from built www/index.html')
          CLASSES=('HeartRateNativePlugin','HeartRateService','HeartRateDatabase','HeartRateMetrics','HeartRateDeviceScanner','HealthConnectNativePlugin')
          missing=[c for c in CLASSES if f'Lcom/mrcdrnzz/dailytracker/{c};'.encode() not in dex]
          if missing:
              # Say which failure this is: a class that is genuinely absent has
              # no trace in the dex at all, while one whose bare name is present
              # means only that the descriptor form assumed here is wrong.
              named=[c for c in missing if c.encode() in dex]
              raise SystemExit('APK is missing compiled native classes: %s%s' % (
                  ', '.join(missing),
                  '' if not named else ' (but these names DO appear in the dex, so the descriptor form above is wrong, not the build: %s)' % ', '.join(named)))
          print('Debug APK embedded source PASS:', hashlib.sha256(bundled).hexdigest())
          print('Debug APK native bridge PASS: all 6 classes present in dex')
          PY
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MARC-debug.apk
          sha256sum release-output/MARC-debug.apk > release-output/MARC-debug.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARC-DEBUG-APK
          path: |
            release-output/MARC-debug.apk
            release-output/MARC-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

name: Build M-ARC Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'www/**'
      - 'native/**'
      - 'branding/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/release-apk.yml'

permissions:
  contents: read

concurrency:
  group: marc-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify locked V36.8.12 web source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          expected='8d2530f9c5675f3bcfffd9a33a3c4ab23f78cab693a91c5d66c986ecef9240b7'
          for f in ('package.json','capacitor.config.json','www/manifest.webmanifest'):
              json.loads(Path(f).read_text(encoding='utf-8'))
          data=Path('www/index.html').read_bytes()
          actual=hashlib.sha256(data).hexdigest()
          if actual != expected: raise SystemExit(f'index hash mismatch: {actual}')
          print('V36.8.12 source hash PASS:', actual)
          PY

      - name: Install npm dependencies
        run: npm install

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>26', s)
          if n == 0: raise SystemExit('minSdkVersion not found')
          p.write_text(s,encoding='utf-8')
          PY
          npx cap sync android
          PKG='android/app/src/main/java/com/mrcdrnzz/dailytracker'
          mkdir -p "$PKG"
          # Replace Capacitor launcher assets with the M•ARC icon already stored in www/.
          ICON='www/icon-512.png'
          test -f "$ICON" || { echo '::error::www/icon-512.png missing'; exit 1; }
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$d"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher.png"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher_round.png"
            cp "$ICON" "android/app/src/main/res/$d/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#06131B</color></resources>
          XML
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Verify bundled source and native plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected='8d2530f9c5675f3bcfffd9a33a3c4ab23f78cab693a91c5d66c986ecef9240b7'
          a=Path('www/index.html').read_bytes()
          b=Path('android/app/src/main/assets/public/index.html').read_bytes()
          if a != b: raise SystemExit('Capacitor bundled index differs from source')
          if hashlib.sha256(b).hexdigest() != expected: raise SystemExit('Android bundled index hash mismatch')
          print('Android bundled index exact-byte PASS')
          PY
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || { echo '::error::MARC launcher icon missing'; exit 1; }
          PLUGINS='android/app/src/main/assets/capacitor.plugins.json'
          for plugin in LocalNotifications Filesystem Share Haptics; do
            grep -qi "$plugin" "$PLUGINS" || { echo "::error::$plugin missing from capacitor.plugins.json"; cat "$PLUGINS"; exit 1; }
          done

      - name: Install stable M-ARC debug signing key
        shell: bash
        env:
          MARC_DEBUG_KEYSTORE_B64: 
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          printf '%s' "$MARC_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains exact V36.8.12 app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          expected='8d2530f9c5675f3bcfffd9a33a3c4ab23f78cab693a91c5d66c986ecef9240b7'
          with zipfile.ZipFile(apk) as z:
              data=z.read('assets/public/index.html')
          actual=hashlib.sha256(data).hexdigest()
          if actual != expected: raise SystemExit(f'APK index mismatch: {actual}')
          print('Debug APK exact V36.8.12 embedded source PASS:', actual)
          PY
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MARC-V36.8.12-debug.apk
          sha256sum release-output/MARC-V36.8.12-debug.apk > release-output/MARC-V36.8.12-debug.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARC-V36.8.12-DEBUG-APK
          path: |
            release-output/MARC-V36.8.12-debug.apk
            release-output/MARC-V36.8.12-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

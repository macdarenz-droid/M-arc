name: Create permanent signing key (one-off)

# Plan R0.0 / finding PL-19. Every CI build used to get a random signing key, so no
# APK could update the last one and Huawei's registered fingerprint was lost.
# This job creates ONE permanent key, stores it as repo secrets, uploads an
# encrypted backup for the owner, and prints the public SHA-256 fingerprint.
# It refuses to run if MARC_SIGNING_KEYSTORE_B64 already exists, so it can never
# replace the key. The key and its password are never printed.
# Delete this file once the owner has saved the backup.
on:
  push:
    branches: ['claude/marc-regression-architecture-gegkbq']
    paths: ['.github/workflows/create-signing-key.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-signing-key
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check prerequisites and refuse to overwrite an existing key
        shell: bash
        env:
          EXISTING: ${{ secrets.MARC_SIGNING_KEYSTORE_B64 }}
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          KEY_EXPORT_PASSPHRASE: ${{ secrets.KEY_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING" ]; then echo '::error::MARC_SIGNING_KEYSTORE_B64 already exists. Not creating another key.'; exit 1; fi
          [ -n "$GH_TOKEN" ] || { echo '::error::Secret SECRETS_WRITE_TOKEN is missing.'; exit 1; }
          [ -n "$KEY_EXPORT_PASSPHRASE" ] || { echo '::error::Secret KEY_EXPORT_PASSPHRASE is missing.'; exit 1; }
          gh secret list --repo "$GITHUB_REPOSITORY" >/dev/null || { echo '::error::SECRETS_WRITE_TOKEN cannot manage secrets (needs Secrets: Read and write on this repo).'; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate the key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/key"
          PW=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)
          echo "::add-mask::$PW"
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/key/marc-signing.p12" -alias marc \
            -keyalg RSA -keysize 4096 -validity 36500 -dname 'CN=MARC, O=MARC, C=AU' \
            -storepass "$PW" -keypass "$PW" 2>/dev/null
          printf '%s' "$PW" > "$RUNNER_TEMP/key/password.txt"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/key/marc-signing.p12" -storepass "$PW" -alias marc | awk '/SHA256:/{print $2; exit}')
          [ -n "$FP" ] || { echo '::error::Could not read the new fingerprint.'; exit 1; }
          echo "FP=$FP" >> "$GITHUB_ENV"
          echo "Permanent signing key SHA-256: $FP"
          {
            echo '### Permanent signing key created'
            echo ''
            echo 'SHA-256 fingerprint (add this in AppGallery Connect):'
            echo ''
            echo "\`$FP\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt the backup
        shell: bash
        env:
          KEY_EXPORT_PASSPHRASE: ${{ secrets.KEY_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup
          tar -C "$RUNNER_TEMP/key" -cf - marc-signing.p12 password.txt \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY_EXPORT_PASSPHRASE -out backup/marc-signing-key.tar.enc
          {
            echo "M/ARC permanent signing key, encrypted with your KEY_EXPORT_PASSPHRASE."
            echo "SHA-256: $FP"
            echo ""
            echo "Restore (on a computer):"
            echo "  openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in marc-signing-key.tar.enc | tar -xf -"
            echo "This gives marc-signing.p12 (alias marc) and password.txt."
          } > backup/README.txt

      - name: Upload the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: marc-signing-key-backup-ENCRYPTED
          path: backup/
          retention-days: 30
          if-no-files-found: error

      - name: Store the key as repository secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          base64 -w0 "$RUNNER_TEMP/key/marc-signing.p12" | gh secret set MARC_SIGNING_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          gh secret set MARC_SIGNING_STORE_PASSWORD --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/key/password.txt"
          if gh variable set MARC_SIGNING_SHA256 --repo "$GITHUB_REPOSITORY" --body "$FP"; then
            echo 'Variable MARC_SIGNING_SHA256 set.'
          else
            echo '::warning::Could not set variable MARC_SIGNING_SHA256 (token lacks Variables: write). The fingerprint is in the job summary.'
          fi
          echo 'Secrets MARC_SIGNING_KEYSTORE_B64 and MARC_SIGNING_STORE_PASSWORD are set.'

      - name: Remove key material from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/key"

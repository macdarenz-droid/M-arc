name: Repair M-ARC APK Workflow Lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repair fixed-version locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path('.github/workflows/build-apk.yml')
          release = Path('.github/workflows/release-apk.yml')
          b = build.read_text(encoding='utf-8')
          r = release.read_text(encoding='utf-8')

          def replace_step(text, start, nxt, replacement):
              pattern = rf"      - name: {re.escape(start)}\n.*?(?=      - name: {re.escape(nxt)}\n)"
              out, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not patch step: {start}')
              return out

          b = replace_step(b, 'Verify locked V36.8.25 web source', 'Install npm dependencies', """      - name: Validate current web source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib, json
          for f in ('package.json','capacitor.config.json','www/manifest.webmanifest'):
              json.loads(Path(f).read_text(encoding='utf-8'))
          data=Path('www/index.html').read_bytes()
          if not data: raise SystemExit('www/index.html is empty')
          print('Current source SHA256:', hashlib.sha256(data).hexdigest())
          PY2

""")

          b = replace_step(b, 'Verify bundled source and native plugins', 'Install stable M-ARC debug signing key', """      - name: Verify bundled source and native plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          source=Path('www/index.html').read_bytes()
          bundled=Path('android/app/src/main/assets/public/index.html').read_bytes()
          if bundled != source: raise SystemExit('Capacitor bundled index differs from current www/index.html')
          print('Android bundled current index exact-byte PASS:', hashlib.sha256(bundled).hexdigest())
          PY2
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || exit 1
          PLUGINS='android/app/src/main/assets/capacitor.plugins.json'
          for plugin in LocalNotifications Filesystem Share Haptics; do grep -qi "$plugin" "$PLUGINS" || exit 1; done

""")

          b = replace_step(b, 'Verify APK contains exact V36.8.25 app', 'Upload debug APK artifact', """      - name: Verify APK contains current app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib, zipfile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          source=Path('www/index.html').read_bytes()
          with zipfile.ZipFile(apk) as z: bundled=z.read('assets/public/index.html')
          if bundled != source: raise SystemExit('APK embedded index differs from current www/index.html')
          print('Debug APK current embedded source PASS:', hashlib.sha256(bundled).hexdigest())
          PY2
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MARC-debug.apk
          sha256sum release-output/MARC-debug.apk > release-output/MARC-debug.apk.sha256

""")
          b=b.replace('MARC-V36.8.25-DEBUG-APK','MARC-DEBUG-APK').replace('MARC-V36.8.25-debug.apk','MARC-debug.apk')

          r = replace_step(r, 'Verify locked V36.8.25 source', 'Install dependencies and generate Android', """      - name: Validate current source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          data=Path('www/index.html').read_bytes()
          if not data: raise SystemExit('www/index.html is empty')
          print('Current source SHA256:', hashlib.sha256(data).hexdigest())
          PY2

""")

          r = replace_step(r, 'Verify bundled bytes and plugins', 'Build unsigned release APK', """      - name: Verify bundled bytes and plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          source=Path('www/index.html').read_bytes()
          bundled=Path('android/app/src/main/assets/public/index.html').read_bytes()
          if bundled != source: raise SystemExit('Android bundled index differs from current www/index.html')
          print('Release bundle current index exact-byte PASS:', hashlib.sha256(bundled).hexdigest())
          PY2
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || exit 1
          PLUGINS='android/app/src/main/assets/capacitor.plugins.json'
          for plugin in LocalNotifications Filesystem Share Haptics; do grep -qi "$plugin" "$PLUGINS" || exit 1; done

""")

          # Flexible replacement: find the historical hash verifier regardless of exact quoting/spacing.
          old_hash='0fecc0147fb18de89b2a649cdc2d9e9c8d81a94c9a1fa7f4385ef578da55e0f9'
          pos=r.find(old_hash)
          if pos < 0:
              raise SystemExit('Could not find release signed-APK fixed hash')
          py_start=r.rfind('          python3 -', 0, pos)
          py_end=r.find('          PY\n', pos)
          if py_start < 0 or py_end < 0:
              raise SystemExit('Could not locate signed APK Python verifier boundaries')
          py_end += len('          PY\n')
          replacement="""          python3 - "$SIGNED" <<'PY'
          from pathlib import Path
          import hashlib,sys,zipfile
          source=Path('www/index.html').read_bytes()
          with zipfile.ZipFile(sys.argv[1]) as z: data=z.read('assets/public/index.html')
          if data != source: raise SystemExit('Signed APK embedded source differs from current www/index.html')
          print('Signed APK current embedded source PASS:',hashlib.sha256(data).hexdigest())
          PY
"""
          r=r[:py_start]+replacement+r[py_end:]
          r=r.replace("description: 'Version name (blank = 36.8.25.<run>)'", "description: 'Version name (blank = current app build + run)'")

          build.write_text(b,encoding='utf-8')
          release.write_text(r,encoding='utf-8')
          print('Repair prepared successfully')
          PY

      - name: Sanity check repaired workflows
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '0fecc0147fb18de89b2a649cdc2d9e9c8d81a94c9a1fa7f4385ef578da55e0f9' .github/workflows/build-apk.yml
          ! grep -q '0fecc0147fb18de89b2a649cdc2d9e9c8d81a94c9a1fa7f4385ef578da55e0f9' .github/workflows/release-apk.yml
          grep -q 'Install stable M-ARC debug signing key' .github/workflows/build-apk.yml
          grep -q 'Signed APK current embedded source PASS' .github/workflows/release-apk.yml
          echo 'Workflow repair checks PASS'

      - name: Commit repaired workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-apk.yml .github/workflows/release-apk.yml
          if git diff --cached --quiet; then echo 'No workflow changes needed'; exit 0; fi
          git commit -m 'Make M-ARC APK workflows version-safe'
          git push

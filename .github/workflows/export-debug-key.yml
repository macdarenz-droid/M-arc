name: Export debug signing key (one-off)

# One-off rescue of the Huawei-registered debug signing key (PL-19, plan R0.0).
# The key exists only in this branch's Actions cache. This job verifies it is the
# registered one, uploads an encrypted copy for the owner's offline backup, and,
# when SECRETS_WRITE_TOKEN is present, stores it as MARC_DEBUG_KEYSTORE_B64.
# The key is never printed. Delete this file once MARC_DEBUG_KEYSTORE_B64 is set.
on:
  push:
    branches: ['claude/escobar-v2-implementation-eidx64']
    paths: ['.github/workflows/export-debug-key.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA256: '05:A0:B1:32:DB:B1:E1:7D:ED:E7:51:78:92:0D:32:B2:7A:EE:54:DC:70:CB:FD:D1:78:3A:FE:38:F8:F1:A6:E8'
    steps:
      - name: Restore the cached debug keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: marc-debug-signing-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify it is the Huawei-registered key
        shell: bash
        run: |
          set -euo pipefail
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | awk '/SHA256:/{print $2; exit}')
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::error::Cached key fingerprint is $FP, expected $EXPECTED_SHA256. Nothing exported."
            exit 1
          fi
          echo "Fingerprint matches the Huawei registration."

      - name: Encrypt for the owner's offline backup
        shell: bash
        env:
          KEY_EXPORT_PASSPHRASE: ${{ secrets.KEY_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_EXPORT_PASSPHRASE" ]; then echo '::error::KEY_EXPORT_PASSPHRASE secret is missing'; exit 1; fi
          mkdir -p out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY_EXPORT_PASSPHRASE \
            -in "$HOME/.android/debug.keystore" -out out/marc-debug.keystore.enc
          printf '%s\n' \
            'Decrypt:  openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in marc-debug.keystore.enc -out marc-debug.keystore' \
            'Check:    keytool -list -v -keystore marc-debug.keystore -storepass android   (SHA256 must be 05:A0:...:A6:E8)' \
            'Secret:   base64 -w0 marc-debug.keystore   -> repo secret MARC_DEBUG_KEYSTORE_B64' > out/README.txt

      - name: Upload the encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: marc-debug-key-encrypted
          path: out/
          retention-days: 5
          if-no-files-found: error

      - name: Store it as MARC_DEBUG_KEYSTORE_B64 (only if SECRETS_WRITE_TOKEN is set)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'SECRETS_WRITE_TOKEN not set: decrypt the artifact and add MARC_DEBUG_KEYSTORE_B64 yourself.'
            exit 0
          fi
          base64 -w0 "$HOME/.android/debug.keystore" | gh secret set MARC_DEBUG_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          echo 'MARC_DEBUG_KEYSTORE_B64 is set.'

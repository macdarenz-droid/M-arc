name: M/ARC Play bundle (unsigned)

# REL-2: builds the Play-ready Android App Bundle the same way release-apk.yml builds its release
# and proves Play's technical requirements.
# PLAY-SIGN (owner, 2026-10-03: "I approve adding the upload-key signing step to .github/workflows/play-bundle.yml,
# which reads the secrets MARC_UPLOAD_KEYSTORE_B64 and MARC_UPLOAD_STORE_PASSWORD to sign the Play bundle with the
# upload key 95:DC:ED:4A."; REL-3): on main and on demand it also signs the bundle with the Play UPLOAD key
# (pinned below), never the permanent app signing key, which Google Play holds. The upload key is read only from
# repo secrets, checked against its pin before use, and removed from the runner at the end.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Validates changes to this pipeline itself before they reach main.
  pull_request:
    paths:
      - '.github/workflows/play-bundle.yml'
      - 'scripts/check-play-bundle.py'

permissions:
  contents: read

concurrency:
  group: marc-play-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Same rule as release-apk.yml with blank inputs (PL-17): package.json is the version source,
          # the run number makes each build unique and rising.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MAJOR="${PKG_VERSION%%.*}"
          VERSION_NAME="${PKG_VERSION}.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="$((MAJOR * 1000000 + GITHUB_RUN_NUMBER))"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid versionCode'; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Validate built web source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          data=Path('www/index.html').read_bytes()
          if not data: raise SystemExit('www/index.html is empty')
          sw=Path('www/sw.js').read_text()
          if '/*__ASSETS__*/' in sw or '__BUILD__' in sw: raise SystemExit('service worker was not stamped')
          print('Built source SHA256:', hashlib.sha256(data).hexdigest())
          PY2

      - name: Generate Android project (includes the Capacitor sync)
        shell: bash
        run: bash scripts/prepare-android.sh

      - name: Apply release version
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'(?m)^(\s*versionCode\s+)\d+\s*$', rf'\g<1>{os.environ["VERSION_CODE"]}', s, count=1)
          s,n2=re.subn(r'(?m)^(\s*versionName\s+)["\'][^"\']+["\']\s*$', rf'\g<1>"{os.environ["VERSION_NAME"]}"', s, count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('Could not set Android version')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify bundled bytes and plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          source=Path('www/index.html').read_bytes()
          bundled=Path('android/app/src/main/assets/public/index.html').read_bytes()
          if bundled != source: raise SystemExit('::error::Android bundled index differs from current www/index.html')
          PY2
          PLUGINS='android/app/src/main/assets/capacitor.plugins.json'
          for plugin in LocalNotifications Filesystem Share Haptics; do grep -qi "$plugin" "$PLUGINS" || { echo "::error::$plugin plugin missing"; exit 1; }; done

      - name: Build unsigned release bundle
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Fetch bundletool
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  '"$RUNNER_TEMP/bundletool.jar" | sha256sum -c -

      - name: Prove Play's technical requirements
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          [ -s "$AAB" ] || { echo "::error::Play bundle check failed: the AAB $AAB does not exist"; exit 1; }
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" > "$RUNNER_TEMP/manifest.xml"
          echo '--- bundletool dump manifest (head) ---'; head -n 5 "$RUNNER_TEMP/manifest.xml"
          grep -n -E 'debuggable|targetSdkVersion' "$RUNNER_TEMP/manifest.xml" || echo '(no android:debuggable attribute: not debuggable)'
          python3 scripts/check-play-bundle.py "$AAB" "$RUNNER_TEMP/manifest.xml" capacitor.config.json "$VERSION_CODE" "$VERSION_NAME"
          mkdir -p play-output
          OUT="play-output/MARC-v${VERSION_NAME}-unsigned.aab"
          cp "$AAB" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Self-test, the checks fail on broken bundles
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          # Each mutation of the real manifest or bundle must make the checker fail with its own message.
          python3 - <<'PY'
          import importlib.util, os, re, shutil, zipfile
          spec = importlib.util.spec_from_file_location('c', 'scripts/check-play-bundle.py'); c = importlib.util.module_from_spec(spec); spec.loader.exec_module(c)
          aab = 'android/app/build/outputs/bundle/release/app-release.aab'
          tmp = os.environ['RUNNER_TEMP']
          m = open(f'{tmp}/manifest.xml', encoding='utf-8').read()
          vc, vn = os.environ['VERSION_CODE'], os.environ['VERSION_NAME']
          pkg = c.PLAY_PACKAGE
          assert c.check(aab, m, pkg, vc, vn) == [], 'real bundle must pass'
          bad32 = f'{tmp}/bad32.aab'; shutil.copy(aab, bad32)
          with zipfile.ZipFile(bad32, 'a') as z: z.writestr('base/lib/armeabi-v7a/libonly32.so', b'\0')
          cases = {
            'debuggable': (aab, re.sub(r'<application\b', '<application android:debuggable="true"', m, count=1), pkg, vc, vn),
            'targetSdk': (aab, re.sub(r'android:targetSdkVersion="\d+"', 'android:targetSdkVersion="35"', m), pkg, vc, vn),
            'package': (aab, re.sub(r'package="[^"]+"', 'package="com.example.wrong"', m, count=1), pkg, vc, vn),
            'appId': (aab, m, pkg + '.drift', vc, vn),
            'versionCode': (aab, m, pkg, str(int(vc) + 1), vn),
            'versionName': (aab, m, pkg, vc, vn + '.x'),
            '64-bit': (bad32, m, pkg, vc, vn),
            'does not exist': (f'{tmp}/missing.aab', m, pkg, vc, vn),
          }
          for want, args in cases.items():
            errs = c.check(*args)
            assert len(errs) == 1 and want in errs[0], f'mutation {want!r} not caught alone: {errs}'
            print(f'mutation {want!r} caught: {errs[0]}')
          PY

      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: MARC-PLAY-AAB-UNSIGNED
          path: |
            play-output/*.aab
            play-output/*.aab.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Sign the bundle with the upload key
        # PLAY-SIGN: never on pull_request runs; PRs prove the unsigned bundle only.
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KS_B64: ${{ secrets.MARC_UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.MARC_UPLOAD_STORE_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_UPLOAD_SHA256: '95:DC:ED:4A:3B:8A:66:67:D8:9B:ED:43:7A:E0:9A:B1:0E:25:7C:FA:6B:8E:2B:17:FA:49:EC:A8:EC:EC:07:9B'
          PERMANENT_SHA256: '05:66:9A:D2:72:1C:6A:BA:F9:FD:D4:B9:B8:4E:2F:B7:94:48:44:B1:DE:F3:59:84:5F:01:5F:2B:67:CA:F1:F5'
        run: |
          set -euo pipefail
          umask 077
          [ -n "$KS_B64" ] || { echo '::error::Secret MARC_UPLOAD_KEYSTORE_B64 is missing. Run "Play - create upload key (one-off)" first (docs/RELEASE-READINESS.md).'; exit 1; }
          [ -n "$PW" ] || { echo '::error::Secret MARC_UPLOAD_STORE_PASSWORD is missing.'; exit 1; }
          [ "$EXPECTED_UPLOAD_SHA256" != "$PERMANENT_SHA256" ] || { echo '::error::The upload key pin equals the permanent key.'; exit 1; }
          KS="$RUNNER_TEMP/marc-upload.p12"
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          # The keystore must hold the pinned upload key before anything is signed with it.
          KEY_FP="$(keytool -list -v -storetype PKCS12 -keystore "$KS" -alias upload -storepass:env PW 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          if [ "$KEY_FP" != "$EXPECTED_UPLOAD_SHA256" ]; then
            rm -f "$KS"
            echo "::error::The upload keystore holds '$KEY_FP', expected $EXPECTED_UPLOAD_SHA256. Nothing was signed."; exit 1
          fi
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          SIGNED="play-output/MARC-v${VERSION_NAME}-upload-signed.aab"
          jarsigner -keystore "$KS" -storetype PKCS12 -storepass:env PW -keypass:env PW \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$SIGNED" "$AAB" upload >/dev/null
          rm -f "$KS"
          # Proof: the bundle verifies, its only signer is the pinned upload key, never the permanent key.
          # No -strict: an upload certificate is self-signed, which -strict reports as an error. The exact
          # "jar verified." line rejects an unsigned jar ("no manifest.") and "with signer errors"; a changed
          # entry fails with exit 1. The signer pin below is the identity check.
          jarsigner -verify "$SIGNED" > "$RUNNER_TEMP/verify.txt" 2>&1 || { cat "$RUNNER_TEMP/verify.txt"; echo '::error::jarsigner -verify failed on the signed bundle.'; exit 1; }
          grep -qx 'jar verified.' "$RUNNER_TEMP/verify.txt" || { cat "$RUNNER_TEMP/verify.txt"; echo '::error::The signed bundle did not verify.'; exit 1; }
          SIGNERS="$(keytool -printcert -jarfile "$SIGNED" | sed -n 's/^[[:space:]]*SHA256: //p' | sort -u)"
          if [ "$SIGNERS" != "$EXPECTED_UPLOAD_SHA256" ]; then
            echo "::error::Signed bundle signer(s) '$SIGNERS', expected only $EXPECTED_UPLOAD_SHA256"; exit 1
          fi
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle "$SIGNED" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$SIGNED" > "$RUNNER_TEMP/manifest-signed.xml"
          cmp -s "$RUNNER_TEMP/manifest.xml" "$RUNNER_TEMP/manifest-signed.xml" || { echo '::error::Signing changed the bundle manifest.'; exit 1; }
          sha256sum "$SIGNED" > "$SIGNED.sha256"
          cat "$SIGNED.sha256"
          {
            echo '### Play bundle signed with the upload key'
            echo "Signer SHA-256: $SIGNERS"
            echo 'Upload it to Play Console from the artifact MARC-PLAY-AAB-UPLOAD-SIGNED.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Self-test, the signer check rejects any other key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          EXPECTED_UPLOAD_SHA256: '95:DC:ED:4A:3B:8A:66:67:D8:9B:ED:43:7A:E0:9A:B1:0E:25:7C:FA:6B:8E:2B:17:FA:49:EC:A8:EC:EC:07:9B'
        run: |
          set -euo pipefail
          umask 077
          # A throwaway key signs a copy; the same signer check as above must reject it.
          T="$RUNNER_TEMP/throwaway"; mkdir -p "$T"
          TPW="$(openssl rand -hex 16)"; echo "::add-mask::$TPW"
          keytool -genkeypair -storetype PKCS12 -keystore "$T/t.p12" -alias t -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Throwaway' -storepass "$TPW" -keypass "$TPW" >/dev/null 2>&1
          jarsigner -keystore "$T/t.p12" -storetype PKCS12 -storepass "$TPW" -keypass "$TPW" \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$T/wrong.aab" android/app/build/outputs/bundle/release/app-release.aab t >/dev/null
          WRONG="$(keytool -printcert -jarfile "$T/wrong.aab" | sed -n 's/^[[:space:]]*SHA256: //p' | sort -u)"
          [ -n "$WRONG" ] || { echo '::error::Self-test could not read the throwaway signer.'; exit 1; }
          [ "$WRONG" != "$EXPECTED_UPLOAD_SHA256" ] || { echo '::error::Self-test: the check accepted a throwaway key.'; exit 1; }
          echo "signer check rejects a throwaway key: $WRONG"
          # The verify check rejects an unsigned bundle and a changed entry in the signed one.
          SIGNED="$(ls play-output/*-upload-signed.aab)"
          if jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab 2>&1 | grep -qx 'jar verified.'; then
            echo '::error::Self-test: the verify check accepted the unsigned bundle.'; exit 1
          fi
          cp "$SIGNED" "$T/tampered.aab"
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); n=[i for i in z.namelist() if i.startswith('base/manifest/')][0]; d=z.read(n); z.close(); z=zipfile.ZipFile(sys.argv[1],'a'); z.writestr(n, d+b' '); z.close()" "$T/tampered.aab" 2>/dev/null
          if jarsigner -verify "$T/tampered.aab" 2>&1 | grep -qx 'jar verified.'; then
            echo '::error::Self-test: the verify check accepted a tampered bundle.'; exit 1
          fi
          echo 'verify check rejects the unsigned bundle and a tampered copy'
          rm -rf "$T"
      - name: Upload the upload-key signed bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MARC-PLAY-AAB-UPLOAD-SIGNED
          path: |
            play-output/*-upload-signed.aab
            play-output/*-upload-signed.aab.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Remove key material from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/marc-upload.p12" "$RUNNER_TEMP/throwaway"

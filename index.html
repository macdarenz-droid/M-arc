<!doctype html>
<html lang="en" data-theme="silent-black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#08090a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>M/ARC</title>
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('marc.theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script>
    // A crash before Preact ever mounts (a bad bundle, a throw during boot) used to leave a
    // silent blank screen — the CSS background paints, nothing else ever does, and there is
    // no signal to diagnose from. This turns that into a visible, plain-words error with a
    // self-service reset, wired up before the app module even loads so it catches everything.
    window.__marcCrash = function (err) {
      try {
        var app = document.getElementById('app');
        if (!app || app.getAttribute('data-crash-shown')) return;
        app.setAttribute('data-crash-shown', '1');
        var msg = (err && (err.stack || err.message)) || String(err);
        var box = document.createElement('div');
        box.style.cssText = 'min-height:100%;display:flex;flex-direction:column;gap:14px;padding:24px 20px;font-family:system-ui,-apple-system,sans-serif;color:#f1f1ee;background:#08090a;box-sizing:border-box;';
        box.innerHTML =
          '<h1 style="font-size:18px;margin:0;">M/ARC could not start</h1>' +
          '<p style="font-size:13px;line-height:1.5;color:#9a9aa2;margin:0;">Something went wrong before the app loaded. Your saved workouts are untouched. Screenshot this for support, or reset the app\'s local data below.</p>' +
          '<pre style="font-size:11px;line-height:1.4;color:#c7c7cd;background:#151519;border:1px solid #2a2a31;border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;max-height:40vh;margin:0;"></pre>' +
          '<button type="button" style="all:unset;background:#c0392b;color:#fff;font-weight:600;font-size:14px;padding:12px;border-radius:10px;text-align:center;cursor:pointer;">Reset app data and reload</button>';
        box.querySelector('pre').textContent = msg;
        box.querySelector('button').addEventListener('click', function () {
          try { localStorage.clear(); } catch (e) {}
          try { if (window.indexedDB && indexedDB.databases) { indexedDB.databases().then(function (dbs) { dbs.forEach(function (d) { indexedDB.deleteDatabase(d.name); }); }); } } catch (e) {}
          location.reload();
        });
        app.appendChild(box);
      } catch (e) { /* nothing more we can do from here */ }
    };
    window.addEventListener('error', function (e) { window.__marcCrash(e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { window.__marcCrash(e.reason); });
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

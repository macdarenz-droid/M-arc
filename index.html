<!doctype html>
<html lang="en" data-theme="silent-black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#08090a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>M/ARC</title>
  <style>
    /* First paint in the saved theme's colours, before the bundle injects its tokens (ST-25).
       tests/theme.test.ts keeps these equal to src/theme/themes.ts. */
    html[data-theme="silent-black"], html[data-theme="silent-black"] body { background: #08090a; color: #f7f8f8; }
    html[data-theme="paper"], html[data-theme="paper"] body { background: #ffffff; color: #37352f; }
    html[data-theme="ember"], html[data-theme="ember"] body { background: #07080a; color: #ffffff; }
    html[data-theme="emerald"], html[data-theme="emerald"] body { background: #0f0f0f; color: #ededed; }
    html[data-theme="midnight"], html[data-theme="midnight"] body { background: #0a2540; color: #f6f9fc; }
  </style>
  <style>
    /* O1: launch overlay "Bar path". Colours are set per-theme by the script below;
       these are the silent-black defaults so there is no flash before it runs. */
    #launch { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; background: #08090a; }
    #launch svg { width: 100%; height: 100%; }
    #launch .settle { transform-box: view-box; transform-origin: 50% 45%; animation: launch-settle 1600ms cubic-bezier(.16,1,.3,1) both; }
    #launch .launch-word { animation: launch-reveal 700ms cubic-bezier(.22,1,.36,1) 1050ms both; }
    /* BUG-34: the line and dot run on CSS animations, not SMIL. Chromium only starts the SVG (SMIL)
       timeline at the load event, which waits for the bundle, so a SMIL start froze the first frame
       (dot at the mark's 0,0, a cap dot at the line's end) until the app had loaded. CSS animations
       start on first paint. Same timings and curves: 100 -> 45.93 over 0.72 s, then -> 0 over 0.5 s;
       the dot glides to 54.07% of the path (the dip at 30,50) over 0.72 s. The gap of 101 (not 100)
       keeps a zero-length dash, drawn as a round cap, off the line's end while dashoffset is 100. */
    #launch-path { animation: launch-draw 1220ms both; }
    #launch-dot { offset-path: path('M8 40H16L22 22L30 50L36 30L40 40H56'); offset-rotate: 0deg; animation: launch-glide 720ms cubic-bezier(.45,0,.25,1) both; }
    #launch.reduce .settle, #launch.reduce .launch-word, #launch.reduce #launch-path { animation: none; opacity: 1; transform: none; filter: none; }
    #launch.reduce #launch-dot { animation: none; offset-path: none; }
    @keyframes launch-settle { from { opacity: 0; transform: scale(.975); } 12% { opacity: 1; } to { opacity: 1; transform: scale(1); } }
    @keyframes launch-draw { 0% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.45,0,.25,1); } 59.0164% { stroke-dashoffset: 45.93; animation-timing-function: cubic-bezier(.35,0,.2,1); } 100% { stroke-dashoffset: 0; } }
    @keyframes launch-glide { from { offset-distance: 0%; } to { offset-distance: 54.07%; } }
    @keyframes launch-reveal { from { opacity: 0; transform: translateY(5px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
  </style>
  <script>
    // Apply the saved theme before first paint so there is no flash; an unknown id keeps the default.
    try {
      var t = localStorage.getItem('marc.theme');
      if (['silent-black', 'paper', 'ember', 'emerald', 'midnight'].indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script>
    // A3-2b: the start-up reset clears the app's caches too, the same folders as clearExportCache()
    // in src/native/share.ts (tests/a3-2b-preload-cache.test.ts keeps the lists equal). Cache Storage
    // holds the service worker's copy of the app; on Android the bridge (injected at <head>) removes
    // the plaintext export copies. Errors are ignored; the promise always resolves.
    window.__marcClearCaches = function () {
      var jobs = [];
      try { if (window.caches) jobs.push(caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      try {
        var cap = window.Capacitor;
        if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.nativePromise) {
          ['MARC Exports', 'MARC Share'].forEach(function (path) { jobs.push(cap.nativePromise('Filesystem', 'rmdir', { path: path, directory: 'CACHE', recursive: true })); });
        }
      } catch (e) {}
      return Promise.all(jobs.map(function (j) { return Promise.resolve(j).catch(function () {}); })).then(function () {});
    };
  </script>
  <script>
    // A crash before Preact ever mounts (a bad bundle, a throw during boot) used to leave a
    // silent blank screen — the CSS background paints, nothing else ever does, and there is
    // no signal to diagnose from. This turns that into a visible, plain-words error with a
    // self-service reset, wired up before the app module even loads so it catches everything.
    // Once the app has rendered (__marcBooted), later errors only log: the app handles them itself.
    // The rescue copy below duplicates src/core/rescue.ts on purpose: it must run before the bundle.
    window.__marcBooted = false;
    // OLD-ANDROID-1b (D-OA1-FLOOR): the bundle needs module scripts, Array.prototype.at,
    // Animation.prototype.finished and CSS color-mix() (Chrome 111). A WebView missing any of
    // them gets one update screen instead of a parse error, a broken app or a blank page.
    // Feature checks, not version numbers: Huawei numbers its WebView its own way.
    // scripts/old-android-floor.mjs lists the same probes; tests/old-android-floor.test.ts keeps them equal.
    (function () {
      var miss = [];
      function probe(id, missing) { try { if (missing()) miss.push(id); } catch (e) { miss.push(id); } }
      probe('modules', function () { return !('noModule' in document.createElement('script')); });
      probe('at', function () { return ![].at; });
      probe('animation', function () { return !(window.Animation && 'finished' in Animation.prototype); });
      probe('color-mix', function () { return !(window.CSS && CSS.supports && CSS.supports('color','color-mix(in srgb, red, red)')); });
      window.__marcUnsupported = miss.length ? miss : null;
    })();
    var marcUnsupportedWaiting = false;
    window.__marcUnsupportedShow = function () {
      try {
        var launchEl = document.getElementById('launch');
        if (launchEl) launchEl.remove();
      } catch (e) {}
      try {
        var app = document.getElementById('app');
        if (!app) {
          if (!marcUnsupportedWaiting) { marcUnsupportedWaiting = true; document.addEventListener('DOMContentLoaded', window.__marcUnsupportedShow); }
          return;
        }
        if (app.getAttribute('data-unsupported')) return;
        app.setAttribute('data-unsupported', '1');
        app.setAttribute('data-crash-shown', '1');
        var m = /Chrome\/(\d+)/.exec(navigator.userAgent);
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483001;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:24px 20px;font-family:system-ui,-apple-system,sans-serif;color:#f1f1ee;background:#08090a;box-sizing:border-box;';
        box.innerHTML =
          '<h1 style="font-size:18px;margin:0;">WebView update</h1>' +
          '<p style="font-size:13px;line-height:1.5;color:#9a9aa2;margin:0;">M/ARC needs a newer Android System WebView.</p>' +
          '<p data-webview style="font-size:11px;line-height:1.4;color:#c7c7cd;margin:0;"></p>' +
          '<a href="market://details?id=com.google.android.webview" style="display:block;text-decoration:none;background:#f1f1ee;color:#08090a;font-weight:600;font-size:14px;padding:12px;border-radius:10px;text-align:center;">Open Play Store</a>';
        box.querySelector('[data-webview]').textContent = 'WebView ' + (m ? m[1] : '?') + ' \u00b7 ' + (window.__marcUnsupported || []).join(', ');
        app.textContent = '';
        app.appendChild(box);
      } catch (e) { /* nothing more we can do from here */ }
    };
    window.__marcRescue = function () {
      var out = {};
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && (k.indexOf('marc.') === 0 || k === 'dailyTrackerPremium')) out[k] = localStorage.getItem(k);
        }
      } catch (e) {}
      var text = JSON.stringify({ app: 'M/ARC', kind: 'rescue', savedAt: new Date().toISOString(), keys: out });
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a');
        a.href = url; a.download = 'marc-rescue.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      } catch (e) {
        try { navigator.clipboard.writeText(text); } catch (e2) {}
      }
    };
    window.__marcCrash = function (err) {
      try {
        var launchEl = document.getElementById('launch');
        if (launchEl) launchEl.remove();
      } catch (e) {}
      try {
        var app = document.getElementById('app');
        if (!app || app.getAttribute('data-crash-shown')) return;
        app.setAttribute('data-crash-shown', '1');
        var msg = (err && (err.stack || err.message)) || String(err);
        var box = document.createElement('div');
        box.style.cssText = 'min-height:100%;display:flex;flex-direction:column;gap:14px;padding:24px 20px;font-family:system-ui,-apple-system,sans-serif;color:#f1f1ee;background:#08090a;box-sizing:border-box;';
        box.innerHTML =
          '<h1 style="font-size:18px;margin:0;">M/ARC could not start</h1>' +
          '<p style="font-size:13px;line-height:1.5;color:#9a9aa2;margin:0;">Something went wrong before the app loaded. Your data is still on this device unless you reset. Save a copy first, then screenshot this for support.</p>' +
          '<pre style="font-size:11px;line-height:1.4;color:#c7c7cd;background:#151519;border:1px solid #2a2a31;border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;max-height:40vh;margin:0;"></pre>' +
          '<button type="button" data-rescue style="all:unset;background:#f1f1ee;color:#08090a;font-weight:600;font-size:14px;padding:12px;border-radius:10px;text-align:center;cursor:pointer;">Save a copy of my data</button>' +
          '<button type="button" data-reset style="all:unset;background:#c0392b;color:#fff;font-weight:600;font-size:14px;padding:12px;border-radius:10px;text-align:center;cursor:pointer;">Reset app data and reload</button>';
        box.querySelector('pre').textContent = msg + '\n\n' + ((window.navigator && navigator.userAgent) || '');
        box.querySelector('[data-rescue]').addEventListener('click', function () { window.__marcRescue(); });
        box.querySelector('[data-reset]').addEventListener('click', function () {
          if (!confirm('This deletes every workout on this device. Continue?')) return;
          try { localStorage.clear(); } catch (e) {}
          try { if (window.indexedDB && indexedDB.databases) { indexedDB.databases().then(function (dbs) { dbs.forEach(function (d) { indexedDB.deleteDatabase(d.name); }); }); } } catch (e) {}
          // A3-2b: reload once the caches are cleared, or after 2 s if the bridge call hangs.
          var done = false;
          var reload = function () { if (done) return; done = true; location.reload(); };
          window.__marcClearCaches().then(reload, reload);
          setTimeout(reload, 2000);
        });
        app.appendChild(box);
      } catch (e) { /* nothing more we can do from here */ }
    };
    window.addEventListener('error', function (e) { if (window.__marcBooted) { console.error(e.error || e.message); return; } if (window.__marcUnsupported) { window.__marcUnsupportedShow(); return; } window.__marcCrash(e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { if (window.__marcBooted) { console.error(e.reason); return; } if (window.__marcUnsupported) { window.__marcUnsupportedShow(); return; } window.__marcCrash(e.reason); });
    // OLD-ANDROID-1b: a script that fails to load fires 'error' on its own element only, which
    // never bubbles to the listener above, so catch it in the capture phase.
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (window.__marcBooted || !t || t === window || t.tagName !== 'SCRIPT') return;
      if (window.__marcUnsupported) { window.__marcUnsupportedShow(); return; }
      window.__marcCrash(new Error('Could not load ' + (t.src || 'a script')));
    }, true);
    // OLD-ANDROID-1b: the app's module script runs before DOMContentLoaded, so by then it has
    // booted, failed visibly, or never ran (an engine without module scripts, an empty entry).
    // No fixed timer: a slow load holds DOMContentLoaded back too.
    try {
      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (window.__marcUnsupported) { window.__marcUnsupportedShow(); return; }
          if (!window.__marcBooted) window.__marcCrash(new Error('App did not start'));
        }, 0);
      });
    } catch (e) {}
  </script>
</head>
<body>
  <div id="launch" aria-hidden="true">
    <svg viewBox="0 0 180 320" preserveAspectRatio="xMidYMid meet">
      <g class="settle">
        <g transform="translate(47 100) scale(1.34)">
          <path id="launch-path" d="M8 40H16L22 22L30 50L36 30L40 40H56" pathLength="100" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100 101" stroke-dashoffset="100" style="stroke: var(--launch-ink, #f7f8f8)"></path>
          <circle id="launch-dot" r="3.1" style="fill: var(--launch-accent, #5e6ad2)"></circle>
        </g>
        <text class="launch-word" x="90" y="196" text-anchor="middle" style="font: 500 17px Inter, system-ui, sans-serif; letter-spacing: 1.2px; fill: var(--launch-ink, #f7f8f8)">M<tspan style="fill: var(--launch-accent, #5e6ad2)">/</tspan>ARC</text>
      </g>
    </svg>
  </div>
  <script>
    // O1: the launch overlay runs before the bundle loads. It self-removes once the app is
    // ready and enough time has passed (or on tap), so index.html defines all of its markup,
    // colours and timing here rather than waiting for src/main.tsx.
    (function () {
      var t0 = performance.now();
      window.__marcLaunchT0 = t0;
      var launch = document.getElementById('launch');
      if (!launch) { window.dispatchEvent(new Event('marclaunchgone')); return; }
      var THEME = {
        'silent-black': { bg: '#08090a', ink: '#f7f8f8', accent: '#5e6ad2' },
        paper: { bg: '#ffffff', ink: '#37352f', accent: '#2383e2' },
        ember: { bg: '#07080a', ink: '#ffffff', accent: '#ff6363' },
        emerald: { bg: '#0f0f0f', ink: '#ededed', accent: '#3ecf8e' },
        midnight: { bg: '#0a2540', ink: '#f6f9fc', accent: '#635bff' },
      };
      var themeId;
      try { themeId = localStorage.getItem('marc.theme'); } catch (e) {}
      var theme = THEME[themeId] || THEME['silent-black'];
      launch.style.background = theme.bg;
      launch.style.setProperty('--launch-ink', theme.ink);
      launch.style.setProperty('--launch-accent', theme.accent);

      var reducePref = false;
      try { reducePref = localStorage.getItem('marc.motion') === 'reduce'; } catch (e) {}
      var reduce = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || reducePref;

      var path = document.getElementById('launch-path');
      var dot = document.getElementById('launch-dot');

      if (reduce) {
        launch.classList.add('reduce');
        if (path) path.setAttribute('stroke-dashoffset', '0');
        if (dot) { dot.setAttribute('cx', '30'); dot.setAttribute('cy', '50'); }
      }

      var appReady = false;
      var left = false;
      var MIN_MS = reduce ? 0 : 1750;
      var FADE_MS = reduce ? 100 : 240;

      function leave() {
        if (left) return;
        left = true;
        launch.style.pointerEvents = 'none';
        launch.style.transition = 'opacity ' + FADE_MS + 'ms cubic-bezier(.3,0,.8,.15)';
        requestAnimationFrame(function () { launch.style.opacity = '0'; });
        setTimeout(function () {
          if (launch.parentNode) launch.remove();
          window.dispatchEvent(new Event('marclaunchgone'));
        }, FADE_MS);
      }

      function scheduleLeave() {
        if (left || !appReady) return;
        var remain = MIN_MS - (performance.now() - t0);
        if (remain <= 0) leave();
        else setTimeout(scheduleLeave, remain);
      }

      window.__marcLaunchReady = function () { appReady = true; scheduleLeave(); };
      launch.addEventListener('pointerdown', leave, { once: true });
      setTimeout(leave, 4000); // hard cap: never hides input if something above hangs
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

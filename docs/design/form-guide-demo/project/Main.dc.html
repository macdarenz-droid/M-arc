<html lang="en">
<head>
<meta charset="utf-8">
<title>Train workouts</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400..700&amp;display=swap">
<style>
body{margin:0;font-family:Roboto,Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
/* Main: the owner's Train screen. Every class starts with mn- so nothing here reaches the imported About sheet.
   Text is drawn at 80% of the stylesheet sizes (--tz). Measured on the owner's screenshot: 1 CSS px = 2.6 screen px
   (44 px button, 58 px nav), and the widths and heights of "Workouts", the row names, the card title, the Start label,
   the dock label and the gym chip all come out at 0.80 of Roboto at the stylesheet sizes. Boxes (buttons 44, pills 38,
   chip 36, dock 40, nav 58) keep their stylesheet sizes, as on his phone.
   Small pills keep a full 44 px touch box: a transparent border around the drawn face (background-clip: padding-box,
   1 px ring drawn as an inset shadow) and an equal negative margin, so the layout matches the stylesheet.
   Text colours: the stylesheet uses --text-3 for hints, the eyebrow and idle nav labels; that is below 4.5:1 on these
   surfaces, so this board uses --text-2 for them. */
.mn-root{--tz:.8;--mn-focus:color-mix(in srgb,var(--accent) 80%,var(--text));position:relative;overflow:hidden;background:var(--bg);color:var(--text);font-family:Roboto,Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:calc(16px * var(--tz));line-height:1.4;-webkit-font-smoothing:antialiased}
.mn-b{appearance:none;-webkit-appearance:none;margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;line-height:inherit;text-align:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
.mn-b:focus-visible{outline:2px solid var(--mn-focus);outline-offset:2px}
.mn-svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mn-scroll{position:absolute;inset:0;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 140px;scrollbar-width:none}
.mn-scroll::-webkit-scrollbar{display:none}
.mn-topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.mn-eyebrow{font-size:calc(11px * var(--tz));font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.mn-h1{margin:0;font-size:calc(28px * var(--tz));font-weight:650;letter-spacing:-.02em;line-height:1.15;color:var(--text)}
.mn-h2{margin:0;font-size:calc(17px * var(--tz));font-weight:600;letter-spacing:-.01em;color:var(--text)}
.mn-hint{font-size:calc(12px * var(--tz));color:var(--text-2)}
/* "+ Split": quiet small button (34 px drawn), 44 px touch box. */
.mn-split{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:-5px 0;padding:0 13px;border-radius:var(--radius-md);color:var(--text-2);font-size:calc(13px * var(--tz));font-weight:600;white-space:nowrap;transition:transform 200ms cubic-bezier(.2,0,0,1)}
.mn-split:active{transform:scale(.97);transition-duration:100ms}
.mn-gymrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
/* Gym chip: 36 px face, 44 px touch box. */
.mn-chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-4px;padding:0 13px;border:4px solid transparent;border-radius:999px;background:var(--surface-2);background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--border);color:var(--text-2);font-size:calc(12px * var(--tz));font-weight:600;white-space:nowrap;transition:scale 200ms cubic-bezier(.2,0,0,1)}
.mn-chip:active{scale:.95;transition-duration:100ms}
.mn-chip:focus-visible{outline-offset:-2px}
/* Split pills: 38 px face, 44 px touch box; the strip clips 12 px from the edge, as on his phone. */
.mn-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;margin:-2px -4px 0;scrollbar-width:none}
.mn-tabs::-webkit-scrollbar{display:none}
.mn-tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:-3px;padding:0 15px;border:3px solid transparent;border-radius:999px;background:var(--surface-1);background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--border);color:var(--text-2);font-size:calc(13px * var(--tz));font-weight:600;white-space:nowrap;transition:scale 200ms cubic-bezier(.2,0,0,1)}
.mn-tab:active{scale:.95;transition-duration:100ms}
.mn-tab:focus-visible{outline-offset:-1px}
.mn-tab-on{background-color:var(--text);color:var(--bg);box-shadow:none}
.mn-dot{flex:none;width:8px;height:8px;border-radius:50%}
.mn-card{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px}
.mn-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mn-icon{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;color:var(--text-2);transition:transform 200ms cubic-bezier(.2,0,0,1)}
.mn-icon:active{transform:scale(.97);transition-duration:100ms}
.mn-list{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;margin-top:6px}
/* Rows: pressable (they open the About sheet). Padding 10.8 instead of the stylesheet's 12: this board is 32 px shorter than
   his screen, and 10.8 keeps the same 20 px gap between the Start button and the Escobar chip, with the chip covering
   "Log a past session" the same way, as in his screenshot.
   The divider sits on the text column, as in the screenshot. */
.mn-row{position:relative;display:flex;align-items:center;gap:12px;width:calc(100% + 16px);min-width:0;min-height:52px;margin:0 -8px;padding:10.8px 8px;border-radius:var(--radius-sm);text-align:left;transition:background-color 150ms cubic-bezier(.2,0,0,1)}
.mn-row::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:var(--border-subtle)}
.mn-row:last-child::after{display:none}
.mn-row:active{background:var(--surface-3);transition:none}
.mn-row:active .mn-sub,.mn-row:active .mn-trail{color:color-mix(in srgb,var(--text-2) 75%,var(--text))}
.mn-row:focus-visible{outline-offset:-2px}
.mn-grow{display:block;flex:1;min-width:0}
.mn-name{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text)}
.mn-sub{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:calc(12px * var(--tz));color:var(--text-2)}
.mn-trail{flex:none;font-size:calc(12px * var(--tz));color:var(--text-2);font-variant-numeric:tabular-nums}
.mn-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:var(--radius-md);font-size:calc(14px * var(--tz));font-weight:600;white-space:nowrap;transition:transform 200ms cubic-bezier(.2,0,0,1)}
.mn-btn:active{transform:scale(.97);transition-duration:100ms}
.mn-primary{margin-top:12px;background:var(--mn-primary);color:var(--on-accent)}
.mn-quiet{background:transparent;color:var(--text-2)}

/* Escobar chip: 40 px face, 44 px touch box, 70 px above the bottom (68 + the 2 px touch border). */
.mn-dock{position:absolute;left:0;right:0;bottom:68px;z-index:20;display:flex;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 28px);min-height:44px;margin-inline:auto;padding:0 17px 0 13px;border:2px solid transparent;border-radius:999px;background:var(--surface-2);background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--border),var(--shadow);color:var(--text);font-size:calc(13px * var(--tz));font-weight:600;transition:background-color 150ms cubic-bezier(.2,0,0,1)}
.mn-dock:active{background-color:var(--surface-3);transition:none}
.mn-dock:focus-visible{outline-offset:0}
.mn-dock .mn-mark{color:var(--accent)}
.mn-dock-label{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mn-nav{position:absolute;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border-subtle)}
.mn-nav-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.mn-navbtn{display:grid;justify-items:center;align-content:start;gap:3px;min-height:58px;padding:10px 0 8px;color:var(--text-2);font-size:calc(11px * var(--tz));font-weight:600}
.mn-navbtn .mn-svg,.mn-navbtn .mn-mark{transition:opacity 100ms cubic-bezier(.2,0,0,1)}
.mn-navbtn:active .mn-svg,.mn-navbtn:active .mn-mark{opacity:.6;transition:none}
.mn-navbtn:focus-visible{outline-offset:-2px}
.mn-now{color:var(--text)}
/* About sheet, opened in place over the screen. */
.mn-layer{position:absolute;inset:0;z-index:30}
.mn-scrim{position:absolute;inset:0;width:100%;height:100%;background:var(--scrim);cursor:default}
.mn-sheet{position:absolute;left:0;right:0;bottom:0;max-height:100%}
/* The real close control for the sheet: laid over About's own close button (x 330-374; y 30-74 at rest, 22-66 once
   About scrolls, because its top bar sticks 8 px higher). About's own close is a link back to this board. */
.mn-close{position:absolute;top:22px;right:16px;z-index:4;width:44px;height:52px;border-radius:22px;background:transparent}
.mn-close:focus-visible{outline-offset:-2px}
.mn-in .mn-scrim{animation:mn-fade-in 240ms cubic-bezier(.05,.7,.1,1) both}
.mn-in .mn-sheet{animation:mn-rise 320ms cubic-bezier(.32,.72,0,1) both}
.mn-out .mn-scrim{animation:mn-fade-out 200ms cubic-bezier(.3,0,.8,.15) both}
.mn-out .mn-sheet{animation:mn-drop 200ms cubic-bezier(.3,0,.8,.15) both}
.mn-out .mn-close,.mn-out .mn-scrim{pointer-events:none}
@keyframes mn-rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes mn-drop{from{transform:none}to{transform:translateY(100%)}}
@keyframes mn-fade-in{from{opacity:0}to{opacity:1}}
@keyframes mn-fade-out{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .mn-split,.mn-chip,.mn-tab,.mn-icon,.mn-row,.mn-btn,.mn-dock,.mn-navbtn .mn-svg,.mn-navbtn .mn-mark{transition:none}
  .mn-split:active,.mn-icon:active,.mn-btn:active{transform:none;opacity:.7}
  .mn-chip:active,.mn-tab:active{scale:1;opacity:.7}
  .mn-in .mn-sheet{animation:mn-fade-in 160ms linear both}
  .mn-out .mn-sheet{animation:mn-fade-out 160ms linear both}
}
</style>

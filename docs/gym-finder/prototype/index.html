#marc-gym-preview .mf-contact b{font-size:12px;font-weight:400;color:var(--mf-fg)}
#marc-gym-preview .mf-contact button{display:flex;gap:5px;align-items:center;font-size:12px;min-height:40px}
#marc-gym-preview .mf-contact button svg{width:14px;height:14px}
#marc-gym-preview .mf-reminder-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 17px;border-top:1px solid var(--mf-quiet)}
#marc-gym-preview .mf-reminder-row b{font-size:12px;font-weight:500;display:block}
#marc-gym-preview .mf-reminder-row div&gt;span{font-size:10px;color:var(--mf-muted);display:block;margin-top:3px}
#marc-gym-preview .mf-switch{width:42px;height:26px;border-radius:30px;background:var(--mf-s3);border:1px solid var(--mf-border);padding:3px;flex-shrink:0}
#marc-gym-preview .mf-switch&gt;span{width:18px;height:18px;background:var(--mf-muted);border-radius:50%;display:block;transition:transform .15s}
#marc-gym-preview .mf-switch[aria-checked=true]{background:var(--mf-action-bg)}
#marc-gym-preview .mf-switch[aria-checked=true]&gt;span{transform:translateX(15px);background:var(--mf-on-accent)}
#marc-gym-preview .mf-nav{display:grid;grid-template-columns:repeat(5,1fr);height:65px;flex-shrink:0;border-top:1px solid var(--mf-quiet);background:var(--mf-bg);padding:7px 6px 9px;z-index:5}
#marc-gym-preview .mf-nav button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;color:var(--mf-muted);font-size:10px;min-height:44px}
#marc-gym-preview .mf-nav button.is-active{color:var(--mf-fg)}

#marc-gym-preview .mf-entry-screen{padding:24px 16px;overflow:hidden}
#marc-gym-preview .mf-entry-top{margin-bottom:18px}
#marc-gym-preview .mf-composer{background:var(--mf-s1);border:1px solid var(--mf-quiet);border-radius:16px;padding:16px}
#marc-gym-preview .mf-composer-row{display:flex;gap:10px;align-items:center;color:var(--mf-accent)}
#marc-gym-preview .mf-ask{border:1px solid var(--mf-border);background:var(--mf-s2);border-radius:24px;min-height:42px;text-align:left;padding:0 14px;flex:1;color:var(--mf-muted);font-size:13px}
#marc-gym-preview .mf-prompts{display:flex;gap:8px;margin-top:14px}
#marc-gym-preview .mf-prompts button{border:1px solid var(--mf-border);border-radius:24px;padding:7px 10px;font-size:11px;min-height:32px}
#marc-gym-preview .mf-finder-entry{display:flex;align-items:center;gap:13px;border:1px solid var(--mf-border);border-radius:16px;width:100%;margin-top:14px;padding:16px;text-align:left;background:var(--mf-s1)}
#marc-gym-preview .mf-entry-pin{background:var(--mf-soft);color:var(--mf-accent-text);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
#marc-gym-preview .mf-finder-entry&gt;span:nth-child(2){flex:1}
#marc-gym-preview .mf-finder-entry b{font-size:14px;font-weight:550;display:block}
#marc-gym-preview .mf-finder-entry small{font-size:11px;display:block;color:var(--mf-muted);margin-top:4px;line-height:1.5}
#marc-gym-preview .mf-finder-entry&gt;svg{width:16px;color:var(--mf-muted)}
#marc-gym-preview .mf-entry-section{margin-top:24px}
#marc-gym-preview .mf-entry-section h2{font-size:16px;letter-spacing:-.2px;margin-bottom:12px}
#marc-gym-preview .mf-quiet{border:1px solid var(--mf-quiet);border-radius:16px;padding:16px;font-size:13px}
#marc-gym-preview .mf-quiet b{font-size:13px;font-weight:550}
#marc-gym-preview .mf-quiet p{color:var(--mf-muted);line-height:1.6;margin-top:3px;font-size:12px}
